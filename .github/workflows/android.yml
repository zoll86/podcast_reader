# ============================================================================
# KÉTNYELVŰ HALLGATÓ — APK-építés a felhőben, ÁLLANDÓ ALÁÍRÁSSAL
#
# Miért fontos az aláírás: az Android csak akkor tekint egy APK-t az előző
# FRISSÍTÉSÉNEK (és őrzi meg az adatokat: könyvtár, fordítások, listák,
# kulcsok), ha ugyanazzal a kulccsal van aláírva. A GitHub gépe minden
# futásnál új „debug" kulcsot csinálna — ezért minden build más aláírást
# kapott, és a telepítéshez le kellett volna törölni az appot, az adatokkal
# együtt.
#
# A megoldás: az első futás legenerál egy kulcstárat, és VISSZAÍRJA a repóba
# (signing/hallgato.keystore). Minden későbbi build ezt használja, tehát az
# APK-k egymás frissítései lesznek. A kulcs a szabványos Android-fejlesztői
# („debug") jelszavakat használja, mert a Gradle ezeket keresi magától:
# így egyetlen sort sem kell a projektben módosítani.
#
# Tudni való: a kulcstár a repóban van, ami nyilvános. Ez sideload-hoz
# (Play Store nélküli telepítéshez) elfogadható, mert a kulcs nem ad hozzáférést
# semmihez — csak azt jelenti, hogy más is tudna ezzel aláírt APK-t készíteni.
# Ha valaha a Play Store-ba kerülne az app, akkor ehelyett GitHub Secretbe
# tett kulcs kell (azt viszont neked kell beállítanod, jelszót nem kezelek).
# ============================================================================
name: Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write            # a Release feltöltéséhez ÉS a kulcstár megőrzéséhez

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true     # kell, hogy a kulcstárat vissza tudjuk írni

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # -- ÁLLANDÓ ALÁÍRÓ KULCS: első futáskor létrejön és bekerül a repóba --
      - name: Állandó aláíró kulcs
        run: |
          set -e
          if [ ! -f signing/hallgato.keystore ]; then
            echo "Nincs kulcstar - letrehozom, es megorzom a repoban."
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/hallgato.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Ketnyelvu hallgato, OU=zoll86, O=zoll86, L=Budapest, C=HU"
            git config user.name  "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/hallgato.keystore
            git commit -m "Allando APK-alairo kulcs (a frissitesek adatvesztes nelkul telepednek)"
            git push
            echo "ELSO FUTAS: a kulcs elkeszult."
          else
            echo "Megvan az allando kulcstar, ezzel irjuk ala."
          fi
          mkdir -p ~/.android
          cp signing/hallgato.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep -E "SHA256|Alias|Valid" || true

      # -- a webapp fájljai a Capacitor www mappájába --
      - name: Web fájlok összegyűjtése
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest www/
          cp -r icons www/

      # -- Capacitor: az Android-projektet ITT generáljuk, nem a repóban tartjuk --
      - name: Capacitor telepítése és Android-projekt generálása
        run: |
          npm install
          npx cap add android
          npx cap sync android
          grep -q "mappa-plugin" android/capacitor.settings.gradle \
            && echo "OK: a Mappa-plugin regisztralva" \
            || (echo "HIBA: a Mappa-plugin nem kerult be" && exit 1)

      # -- SÖTÉT RENDSZERSÁVOK: a nav-sáv fehér csíkja ellen --
      - name: Sötét rendszersávok
        run: |
          F=android/app/src/main/res/values/styles.xml
          if [ -f "$F" ] && ! grep -q navigationBarColor "$F"; then
            sed -i 's|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item>\n        <item name="android:statusBarColor">#0B0A0E</item>\n        <item name="android:navigationBarColor">#0B0A0E</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowLightNavigationBar">false</item>|' "$F"
            echo "sotet savok beirva"
          else
            echo "styles.xml hianyzik vagy mar be van allitva"
          fi
          cat "$F" || true

      # -- ikonok a meglévő 512-es PWA-ikonból --
      - name: App-ikonok generálása
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/logo.png
          cp icons/icon-512.png assets/logo-dark.png
          npx @capacitor/assets generate --android || echo "ikon-generalas kihagyva"
          npx cap sync android

      # -- ALÁÍRÁS EXPLICIT BEKÖTÉSE: nem bízunk a ~/.android/debug.keystore
      #    alapértelmezésben (a CI-n a Gradle friss kulcsot generált helyette,
      #    ezért volt MINDEN build más aláírású). A signingConfig kőbe vésve
      #    a repó kulcsára mutat; ha a beírás nem sikerül, a build ELBUKIK. --
      - name: Aláírás bekötése a Gradle-be
        run: |
          python3 - <<'PY'
          import io,os,re,sys
          f='android/app/build.gradle'
          ks=os.path.join(os.environ['GITHUB_WORKSPACE'],'signing','hallgato.keystore')
          s=io.open(f).read()
          if 'signingConfigs' in s:
              print('mar be van kotve'); sys.exit(0)
          blk=("    signingConfigs {\n"
               "        hallgato {\n"
               "            storeFile file('"+ks+"')\n"
               "            storePassword 'android'\n"
               "            keyAlias 'androiddebugkey'\n"
               "            keyPassword 'android'\n"
               "        }\n"
               "    }\n")
          m=re.search(r'android\s*\{',s)
          if not m: print('HIBA: nincs android blokk'); sys.exit(1)
          s=s[:m.end()]+'\n'+blk+s[m.end():]
          if re.search(r'buildTypes\s*\{',s):
              s=re.sub(r'(buildTypes\s*\{)',
                r'\1\n        debug { signingConfig signingConfigs.hallgato }',s,count=1)
          else:
              s=re.sub(r'(signingConfigs \{[\s\S]*?\n    \}\n)',
                r'\1    buildTypes { debug { signingConfig signingConfigs.hallgato } }\n',s,count=1)
          io.open(f,'w').write(s)
          print('OK: alairas bekotve ->',ks)
          PY
          grep -n "hallgato" android/app/build.gradle

      - name: APK építése
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK átnevezése
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ketnyelvu-hallgato.apk
          VER=$(grep -o "APP_VER='v[0-9]*'" index.html | head -1 | grep -o "v[0-9]*")
          echo "verzio: $VER" > apk-verzio.txt
          echo "APK: $(du -h ketnyelvu-hallgato.apk | cut -f1)"

      # -- ELLENŐRZÉS: ha az APK nem az állandó kulccsal készült, a build ELBUKIK,
      #    hogy ez a hiba soha többé ne csússzon át némán --
      - name: Aláírás ellenőrzése
        run: |
          KS_FP=$(keytool -list -keystore signing/hallgato.keystore -storepass android \
            -alias androiddebugkey -v | grep "SHA256:" | head -1 \
            | sed 's/.*SHA256: //' | tr -d ': ' | tr 'A-F' 'a-f')
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs ketnyelvu-hallgato.apk \
            | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "kulcstar : $KS_FP"
          echo "apk      : $APK_FP"
          if [ -z "$KS_FP" ] || [ "$KS_FP" != "$APK_FP" ]; then
            echo "HIBA: az APK NEM az allando kulccsal van alairva!"
            exit 1
          fi
          echo "OK: az APK az allando kulccsal keszult — a frissitesek adatvesztes nelkul telepednek."

      - name: Release frissítése
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Ketnyelvu hallgato - legfrissebb APK"
          body: |
            Automatikus epites. Toltsd le a .apk fajlt es telepitsd.

            Az APK allando kulccsal van alairva, ezert a kovetkezo verziok
            FRISSITESKENT telepednek: a konyvtar, a forditasok, a listak, a
            haladas es a kulcsok megmaradnak.
          files: |
            ketnyelvu-hallgato.apk
            apk-verzio.txt
          prerelease: false
